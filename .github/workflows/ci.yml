name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python lint
        working-directory: backend
        run: |
          python -m pip install -U pip
          python -m pip install ruff mypy
          python -m ruff check app tests
          python -m ruff format --check app tests
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b --pretty false

  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-must-be-at-least-32b
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      REDIS_URL: ""
      MAIL_PASSWORD: ""
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: backend
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pytest tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  migrations:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-must-be-at-least-32b
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m alembic upgrade head
          python -m alembic heads
          python -m alembic upgrade head

  env-sync:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-must-be-at-least-32b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_env_sync.py tests/test_settings.py -q

  denylist-grep:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Forbidden symbols
        run: |
          if grep -R --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.venv \
            -nE 'GOOGLE_MAPS|GMAIL_OAUTH' . ; then
            echo "forbidden symbol present"
            exit 1
          fi
          python scripts/denylist_grep.py
          echo "denylist clean"
