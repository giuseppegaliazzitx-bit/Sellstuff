name: infra

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose config (dev)
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Compose config (prod overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
      - name: Denylist
        run: |
          if grep -R --exclude-dir=node_modules --exclude-dir=.git -nE 'GOOGLE_MAPS|GMAIL_OAUTH' . ; then
            exit 1
          fi

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning
