name: release

on:
  push:
    tags:
      - "v*"
      - "phase-*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/giuseppegaliazzitx-bit/sellstuff-backend:${{ github.ref_name }}
            ghcr.io/giuseppegaliazzitx-bit/sellstuff-backend:sha-${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/giuseppegaliazzitx-bit/sellstuff-frontend:${{ github.ref_name }}
            ghcr.io/giuseppegaliazzitx-bit/sellstuff-frontend:sha-${{ github.sha }}
