[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northstar-dispo"
version = "0.0.0"
description = "Northstar Dispo API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=23.0.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "aiosqlite>=0.20.0",
  "redis>=5.2.0",
  "pyjwt>=2.10.0",
  "structlog>=24.4.0",
  "httpx>=0.28.0",
  "uuid-utils>=0.10.0",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]
